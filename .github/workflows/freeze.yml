name: Freeze benchmark snapshot

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable benchmark version (for example v0.2.0)'
        required: true
        type: string
      source_revision:
        description: 'Exact main commit to freeze, or main'
        required: true
        default: 'main'
        type: string
      snapshot_kind:
        description: 'Development evidence or promoted evaluation release'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - evaluation
      candidates:
        description: 'Comma-separated candidate IDs from adapters/candidates.json'
        required: true
        default: 'bifrost,gopls'
        type: string

permissions:
  contents: read

concurrency:
  group: usagebench-freeze-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: validate and freeze evidence
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      revision: ${{ steps.identity.outputs.revision }}
      snapshot_kind: ${{ steps.identity.outputs.snapshot_kind }}
      release_name: ${{ steps.identity.outputs.release_name }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable source identity
        id: identity
        shell: bash
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          SNAPSHOT_VERSION: ${{ inputs.version }}
          SNAPSHOT_KIND: ${{ inputs.snapshot_kind }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" == "main" || "$SOURCE_REVISION" =~ ^[0-9a-fA-F]{7,40}$ ]] || {
            echo "source revision must be main or a hexadecimal commit prefix" >&2
            exit 1
          }
          [[ "$SNAPSHOT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          revision="$(git rev-parse --verify HEAD^{commit})"
          git merge-base --is-ancestor "$revision" refs/remotes/origin/main || {
            echo "source revision $revision is not reachable from origin/main" >&2
            exit 1
          }
          existing_tag_commit="$(git ls-remote origin "refs/tags/$SNAPSHOT_VERSION^{}" | awk '{print $1}')"
          if [[ -z "$existing_tag_commit" ]]; then
            existing_tag_commit="$(git ls-remote origin "refs/tags/$SNAPSHOT_VERSION" | awk '{print $1}')"
          fi
          if [[ -n "$existing_tag_commit" ]]; then
            [[ "$existing_tag_commit" == "$revision" ]] || {
              echo "existing tag $SNAPSHOT_VERSION does not identify $revision" >&2
              exit 1
            }
            if gh release view "$SNAPSHOT_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $SNAPSHOT_VERSION already exists and will not be replaced" >&2
              exit 1
            fi
          fi
          cff_version="$(sed -n 's/^version: "\([^"\]*\)"/\1/p' CITATION.cff)"
          if [[ "$cff_version" != "${SNAPSHOT_VERSION#v}" ]]; then
            echo "CITATION.cff version $cff_version does not match $SNAPSHOT_VERSION" >&2
            exit 1
          fi
          release_name="$SNAPSHOT_VERSION"
          if [[ "$SNAPSHOT_KIND" == "development" ]]; then
            release_name="$SNAPSHOT_VERSION development snapshot"
          fi
          {
            echo "tag=$SNAPSHOT_VERSION"
            echo "revision=$revision"
            echo "snapshot_kind=$SNAPSHOT_KIND"
            echo "release_name=$release_name"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo + target
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test harness
        run: cargo test --locked

      - name: Validate benchmark cases
        run: cargo run --locked -- validate benchmarks/cases

      - name: Validate citation metadata
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: '--validate'

      - name: Run selected candidates and freeze manifest
        shell: bash
        env:
          SNAPSHOT_KIND: ${{ steps.identity.outputs.snapshot_kind }}
          SNAPSHOT_VERSION: ${{ steps.identity.outputs.tag }}
          CANDIDATES: ${{ inputs.candidates }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          set -euo pipefail
          scripts/stage-release-bundle.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/freeze-corpus" \
            "$SNAPSHOT_VERSION" \
            "$REVISION"
          scripts/run-freeze-candidates.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/adapters/candidates.json" \
            "$CANDIDATES" \
            "$RUNNER_TEMP/freeze-corpus" \
            "$RUNNER_TEMP/freeze-evidence" \
            "$REVISION"

      - name: Generate public result fragments from frozen reports
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- generate-results \
            --manifest "$RUNNER_TEMP/freeze-evidence/freeze-manifest.json" \
            --output-directory "$RUNNER_TEMP/freeze-results"

      - name: Stage release evidence bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.revision }}
        run: |
          set -euo pipefail
          stage="usagebench-${RELEASE_TAG}"
          scripts/stage-release-bundle.sh \
            . "dist/$stage" "$RELEASE_TAG" "$RELEASE_COMMIT" \
            "$RUNNER_TEMP/freeze-evidence" "$RUNNER_TEMP/freeze-results"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          (
            cd dist
            sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"
          )

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freeze-release-assets
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    name: approve, tag, and publish
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout frozen revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release assets before tagging
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: freeze-release-assets
          path: dist

      - name: Recheck and create immutable annotated tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          SNAPSHOT_KIND: ${{ needs.prepare.outputs.snapshot_kind }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_tag_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          if [[ -z "$existing_tag_commit" ]]; then
            existing_tag_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          fi
          if [[ -n "$existing_tag_commit" ]]; then
            [[ "$existing_tag_commit" == "$RELEASE_REVISION" ]] || {
              echo "existing tag $RELEASE_TAG does not identify the frozen revision" >&2
              exit 1
            }
            echo "reusing verified recovery tag $RELEASE_TAG"
            exit 0
          fi
          [[ "$(git rev-parse HEAD)" == "$RELEASE_REVISION" ]] || {
            echo "checkout does not match frozen revision" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_REVISION" -m "UsageBench $SNAPSHOT_KIND snapshot $RELEASE_TAG"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)" \
            push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
