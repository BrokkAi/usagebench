[package]
name = "usagebench"
version = "0.3.1"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
jsonschema = "0.18"
schemars = { version = "0.8", features = ["url"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.10"
tar = "0.4"
url = { version = "2.5", features = ["serde"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
